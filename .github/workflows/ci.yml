name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=1
      - run: npm run build
      - name: Bundle Worker for deployment
        run: npx wrangler deploy --dry-run --outdir compiled-worker
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          npx vite preview --host 127.0.0.1 --port 8795 &
          npx playwright test --workers=1
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            dist/
            compiled-worker/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: news-ui-preview
          path: |
            test-results/news-*.png
            test-results/news-load-metrics.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-diagnostics
          path: test-results/
          retention-days: 7
